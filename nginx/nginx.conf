events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    # Reserve multipart overhead; the backend limits each file to 50 MiB.
    client_max_body_size 51M;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # API requests → FastAPI backend
        location /api/ {
            proxy_pass http://backend;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # New bundles must only be served through the sandboxed API route.
        location ~ "^/media/(?:.*/)?\\.presentations(?:/|$)" {
            return 404;
        }

        # Legacy media files → served directly from filesystem
        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public, immutable";
        }

        # Frontend → React SPA (static files)
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
