# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions
# More info on Python, GitHub Actions, and Azure App Service: https://aka.ms/python-webapps-actions

name: Build and deploy Python app to Azure Web App - gmath-api

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            admin-frontend/package-lock.json

      # No VITE_* variables on purpose: both apps then call the same-origin /api/v1.
      - name: Build public frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Build admin frontend (served under /admin/)
        working-directory: admin-frontend
        run: |
          npm ci
          npm run build

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install backend dependencies and run tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt
          python -m pytest -q

      # Oryx (SCM_DO_BUILD_DURING_DEPLOYMENT=true) runs pip install on Azure, so ship no venv.
      - name: Assemble deployment package
        run: |
          mkdir -p deploy
          rsync -a \
            --exclude 'tests' --exclude '__pycache__' --exclude '*.db' \
            --exclude '_test_media' --exclude '.pytest_cache' --exclude 'web' \
            backend/ deploy/
          mkdir -p deploy/web
          cp -r frontend/dist deploy/web/public
          cp -r admin-frontend/dist deploy/web/admin

      - name: Upload artifact for deployment jobs
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: python-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_7742D257263B4217BEB9AA490B5708A2 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_55AE92ADD6C64FA7AD96AB305B0DD77C }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_B7828C3540FE4328A8A9476CCDB341AB }}

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'gmath-api'
          slot-name: 'Production'
          
