services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:8080/api
      - VITE_PROXY_TARGET=http://backend:8000
      # Browser-reachable backend origin for sandboxed presentation iframes.
      - VITE_PRESENTATION_ORIGIN=http://localhost:8000

  backend:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./media:/media
    environment:
      - DATABASE_URL=postgresql+asyncpg://gmath:gmath@db:5432/gmath
      - MEDIA_ROOT=/media/content
      - JWT_SECRET=dev-secret-change-me
      - CORS_ORIGINS=http://localhost:5173,http://localhost:5174,http://localhost:3000
    depends_on:
      db:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gmath
      POSTGRES_USER: gmath
      POSTGRES_PASSWORD: gmath
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmath"]
      interval: 5s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./media:/media:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
