<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>G-Math | מתמטיקה לכל</title>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{--g-green:#4CAF50;--g-blue:#1565C0;--bg:#fff;--bg2:#f8f9f5;--tp:#1A1A2E;--ts:#555770;--tm:#6B6B80;--bd:#E8E8EE;--r:16px;--zoom:1;--card-bg:#fff;--hero-bg:linear-gradient(135deg,#E8F5E9 0%,#E3F2FD 50%,#E8F5E9 100%);--overlay-bg:rgba(255,255,255,.92);--shadow-c:rgba(0,0,0,.08);}

html{font-size:calc(16px * var(--zoom));scroll-behavior:smooth;}
body{font-family:'Rubik','Assistant',-apple-system,sans-serif;color:var(--tp);background:var(--bg);min-height:100vh;display:flex;flex-direction:column;padding-bottom:52px;font-size:17px;line-height:1.6;}
a{text-decoration:none;color:inherit;cursor:pointer;}
.page{display:none;flex:1;opacity:0;transition:opacity .25s ease;}.page.active{display:flex;flex-direction:column;flex:1;opacity:1;}

/* ─── HEADER ─── */
.hdr{position:sticky;top:0;z-index:100;background:var(--overlay-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--bd);padding:12px 28px;display:flex;align-items:center;}
.logo{display:flex;align-items:baseline;gap:2px;font-size:1.45rem;font-weight:700;cursor:pointer;}
.lg{color:var(--g-green);}.lm{color:var(--g-blue);}
.lt{font-size:.78rem;color:var(--tm);margin-inline-start:10px;font-weight:400;}

/* ─── STICKY FOOTER ─── */
.ftr{position:fixed;bottom:0;left:0;right:0;z-index:100;background:var(--overlay-bg);backdrop-filter:blur(10px);border-top:1px solid var(--bd);padding:10px 28px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;}
.fb{font-size:.85rem;color:var(--tm);}.fb b{color:var(--g-blue);}
.fn{display:flex;gap:12px;}.fn a{font-size:.82rem;color:var(--ts);}.fn a:hover{color:var(--g-blue);}
.ft{display:flex;align-items:center;gap:8px;}
.zg{display:flex;align-items:center;gap:4px;background:#f0f3ed;padding:3px 8px;border-radius:7px;}
.zl{font-size:.72rem;color:#64748b;font-weight:600;}
.zb{width:24px;height:24px;display:flex;align-items:center;justify-content:center;background:#e2e7dc;border:none;border-radius:5px;font-size:.9rem;color:#475569;cursor:pointer;font-weight:bold;font-family:inherit;transition:all .15s;}
.zb:hover:not(:disabled){background:#c8d4c2;}.zb:disabled{color:#94a3b8;cursor:not-allowed;background:#f1f5ef;}
.zp{font-size:.72rem;font-weight:700;min-width:32px;text-align:center;color:#1e293b;}
.dv{width:1px;height:18px;background:#dde1e7;}
.ls{display:flex;gap:2px;}
.lb{padding:3px 9px;border-radius:5px;font-size:.62rem;border:none;cursor:pointer;font-weight:600;font-family:inherit;transition:all .15s;}
.lb.on{background:var(--g-blue);color:#fff;}.lb:not(.on){background:#e2e7dc;color:#475569;}.lb:hover:not(.on){background:#c8d4c2;}

.hero-img::after{content:'';position:absolute;top:0;bottom:0;left:auto;right:0;width:200px;background:linear-gradient(to right,transparent 0%,rgba(255,255,255,.4) 40%,rgba(255,255,255,.85) 75%,#fff 100%);}
.hero-content{flex:2;display:flex;flex-direction:column;justify-content:center;background:#fff;padding:48px 40px 36px 24px;color:var(--tp);direction:rtl;position:relative;max-width:480px;}

/* ── Hero Carousel ── */
.hero-carousel{position:relative;width:100%;overflow:hidden;}
.hero-track{display:flex;transition:transform 1.1s cubic-bezier(.25,.1,.25,1);will-change:transform;}
.hero-slide{min-width:100%;display:flex;flex-direction:column;justify-content:flex-start;padding:16px 0;min-height:240px;}
.hero h1{font-size:clamp(1.4rem,2.6vw,2rem);font-weight:800;margin-bottom:12px;letter-spacing:-.01em;line-height:1.35;color:#084743;}
.hero h2.hero-sub{font-size:clamp(1rem,1.8vw,1.25rem);font-weight:500;color:var(--g-blue);margin-bottom:20px;line-height:1.5;}
.hero .sub{font-size:.92rem;color:var(--ts);line-height:1.75;margin-bottom:20px;}
.hero-btn-row{margin-top:auto;padding-top:12px;}
.hero-btn{display:inline-flex;align-items:center;gap:8px;padding:12px 28px;background:var(--g-green);color:#fff;border:none;border-radius:8px;font-size:.9rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all .25s;text-decoration:none;}
.hero-btn:hover{background:#43A047;transform:translateY(-1px);box-shadow:0 4px 16px rgba(76,175,80,.3);}
.hero-btn:active{transform:scale(.98);}
.hero-btn svg{width:16px;height:16px;fill:#fff;}

/* ── Dots ── */
.hero-dots{display:flex;gap:8px;padding:14px 0 0;direction:rtl;}
.hero-dot{width:9px;height:9px;border-radius:50%;background:#ddd;cursor:pointer;transition:all .3s;}
.hero-dot.active{background:var(--g-green);transform:scale(1.2);}

/* ── Stats bar ── */
.stb{display:flex;gap:18px;padding:14px 0;border-top:1px solid var(--bd);font-size:.82rem;color:var(--ts);font-weight:500;margin-top:auto;direction:rtl;}.stb strong{color:var(--g-blue);font-weight:700;font-size:1rem;}


/* ── Icon quick links (like OpenU 4-icons) ── */
.hero-links{display:flex;gap:0;border-top:1px solid var(--bd);margin-top:8px;}
.hero-link{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;text-align:center;font-size:.72rem;font-weight:600;color:var(--ts);cursor:pointer;transition:all .2s;border-left:1px solid var(--bd);}
.hero-link:last-child{border-left:none;}
.hero-link:hover{background:var(--bg2);color:var(--g-blue);}
.hero-link svg{width:28px;height:28px;fill:var(--g-blue);}
.trust{display:flex;gap:14px;justify-content:center;padding:0 24px;margin-top:-40px;position:relative;z-index:5;flex-wrap:wrap;}
.trust-card{flex:1;max-width:240px;background:var(--card-bg);border-radius:14px;padding:20px 16px;text-align:center;box-shadow:0 8px 28px var(--shadow-c);border:1.5px solid var(--bd);transition:all .3s;}
.trust-card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(67,97,238,.16);border-color:rgba(67,97,238,.2);}
.trust-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;margin:0 auto 10px;}
.trust-card:nth-child(1) .trust-icon{background:linear-gradient(135deg,#E8F5E9,#C8E6C9);}
.trust-card:nth-child(2) .trust-icon{background:linear-gradient(135deg,#E3F2FD,#BBDEFB);}
.trust-card:nth-child(3) .trust-icon{background:linear-gradient(135deg,#FFF3E0,#FFE0B2);}
.trust-text{font-size:.88rem;font-weight:500;color:#334155;line-height:1.5;}
.sym{display:none;}

/* ─── HOME GRID ─── */
.tsc{padding:40px 28px 48px;max-width:1200px;margin:0 auto;width:100%;}
.tsc h2{font-size:1.6rem;text-align:center;margin-bottom:28px;}
.tg{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.tc{background:var(--card-bg);border:1px solid var(--bd);border-radius:var(--r);padding:22px 18px;display:flex;align-items:flex-start;gap:12px;transition:all .25s cubic-bezier(.4,0,.2,1);cursor:pointer;position:relative;overflow:hidden;}
.tc:hover{transform:translateY(-4px);box-shadow:0 8px 30px rgba(0,0,0,.12);}
.tc::before{content:'';position:absolute;inset-inline-start:0;top:0;bottom:0;width:4px;background:var(--cc);opacity:0;transition:opacity .25s;}.tc:hover::before{opacity:1;}
.tci{width:46px;height:46px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:1.3rem;flex-shrink:0;}
.tcn h3{font-size:1.05rem;font-weight:600;margin-bottom:3px;}.tcn p{font-size:.85rem;color:var(--tm);line-height:1.5;}

/* ─── BREADCRUMB ─── */
.bc{padding:12px 28px;font-size:.9rem;color:var(--tm);display:flex;align-items:center;gap:7px;flex-wrap:wrap;border-bottom:1px solid var(--bd);background:var(--bg2);}
.bc a{color:var(--g-blue);}.bc a:hover{text-decoration:underline;}
.bc .s{color:#ccc;}

/* ─── TOPIC PAGE: TABS ─── */
.ttabs{display:flex;gap:5px;padding:10px 28px;overflow-x:auto;border-bottom:1px solid var(--bd);background:var(--bg);scrollbar-width:none;}.ttabs::-webkit-scrollbar{display:none;}
.tt{padding:7px 14px;border-radius:9px;font-size:.73rem;font-weight:500;cursor:pointer;white-space:nowrap;border:1px solid var(--bd);background:var(--bg);transition:all .2s;display:flex;align-items:center;gap:4px;}
.tt:hover{background:#f5f7fa;}.tt.on{color:#fff;border-color:transparent;}

/* ─── TOPIC PAGE: CHIPS + SCROLL LAYOUT ─── */
.tp-wrap{flex:1;overflow-y:auto;}
.tp-header{display:flex;align-items:center;gap:14px;padding:20px 28px 12px;}
.tp-hicon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;}
.tp-header h2{font-size:1.2rem;font-weight:700;}.tp-header .cnt{font-size:.82rem;color:var(--tm);margin-top:1px;}
.tp-bar{display:flex;align-items:center;gap:10px;padding:10px 28px 14px;flex-wrap:wrap;position:sticky;top:0;background:var(--overlay-bg);backdrop-filter:blur(10px);z-index:10;border-bottom:1px solid var(--bd);}
.tp-search{position:relative;flex-shrink:0;}
.tp-si{padding:8px 14px 8px 32px;border:1.5px solid var(--bd);border-radius:10px;font-size:.82rem;font-family:inherit;outline:none;width:220px;transition:all .2s;direction:inherit;background:var(--bg);}
.tp-si:focus{border-color:var(--g-blue);box-shadow:0 0 0 3px rgba(21,101,192,.08);width:260px;}
.tp-search::before{content:'🔍';position:absolute;inset-inline-start:10px;top:50%;transform:translateY(-50%);font-size:.7rem;pointer-events:none;z-index:1;}
.tp-si{padding-inline-start:32px !important;}
.tp-empty{text-align:center;padding:48px 28px;color:var(--tm);font-size:.9rem;}
/* ─── TOPIC NAV — Tabs embedded in banner image (OpenU style) ─── */
.tp-banner{padding:0;position:relative;overflow:hidden;}
.tp-banner-bg{width:100%;height:220px;display:block;}
.tp-nav-bar{position:absolute;bottom:0;left:0;right:0;z-index:2;display:flex;justify-content:center;}
.tp-nav{display:flex;gap:0;overflow-x:auto;scrollbar-width:none;width:100%;max-width:1100px;margin:0 auto;}
.tp-nav::-webkit-scrollbar{display:none;}
.tp-nav-btn{flex:1 1 0;min-width:0;cursor:pointer;padding:0;border:none;position:relative;transition:background .35s;}
.tp-nav-btn+.tp-nav-btn{border-right:1px solid rgba(255,255,255,.15);}
.tp-nav-link{display:flex;flex-direction:column;align-items:center;justify-content:center;text-decoration:none;height:72px;width:100%;padding:6px 4px;background:rgba(255,255,255,.85);transition:background .35s;}
.tp-nav-btn:hover .tp-nav-link{background:var(--nav-c,#002C7D);}
.tp-nav-btn.on .tp-nav-link{background:var(--nav-c,#002C7D);}
.tp-nav-icon{font-size:1.5rem;transition:color .35s;color:var(--nav-c,#2364db);line-height:1;margin-bottom:4px;}
.tp-nav-btn.on .tp-nav-icon,.tp-nav-btn:hover .tp-nav-icon{color:#fff;}
.tp-nav-label{font-size:.85rem;font-weight:600;color:#2364db;white-space:nowrap;text-align:center;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:1.2;transition:color .35s;}
.tp-nav-btn.on .tp-nav-label{color:#fff;font-weight:700;}
.tp-nav-btn:hover .tp-nav-label{color:#fff;}
@media(max-width:767px){.tp-nav-link{height:66px;}.tp-nav-label{font-size:.75rem;}}
/* ─── SUBTOPIC GRID CARDS (Option A — Hover Expand) ─── */
.tp-grid{padding:20px 28px 40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:18px;align-items:start;}
.tp-card{background:var(--card-bg);border:2px solid var(--bd);border-radius:18px;cursor:pointer;transition:all .35s;position:relative;overflow:hidden;display:flex;flex-direction:column;z-index:1;}
.tp-card:hover{border-color:#a5b4fc;box-shadow:0 8px 28px rgba(0,0,0,.1);z-index:200;}
.tp-card-img{height:140px;border-radius:16px 16px 0 0;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;}
.tp-card-img::after{content:'';position:absolute;bottom:-1px;left:-5%;right:-5%;height:24px;background:var(--card-bg);border-radius:50% 50% 0 0;}
.tp-card-img svg{width:70px;height:70px;opacity:.85;}
.tp-card-img .tp-overlay{font-size:2.6rem;position:absolute;z-index:2;filter:drop-shadow(0 2px 6px rgba(0,0,0,.15));color:#fff;font-weight:700;font-family:serif;}
.tp-card-body{padding:14px 16px 12px;text-align:center;}
.tp-card-name{font-size:1.05rem;font-weight:700;line-height:1.3;margin-bottom:4px;}
.tp-card-meta{font-size:.8rem;color:var(--tm);display:flex;align-items:center;justify-content:center;gap:6px;}
.tp-card-dot{width:8px;height:8px;border-radius:50%;opacity:.25;transition:opacity .2s;}
.tp-card:hover .tp-card-dot{opacity:1;}
/* Lessons expand from inside the card on hover */
.tp-card-lessons{max-height:0;overflow:hidden;transition:max-height .4s cubic-bezier(.4,0,.2,1);}
.tp-card:hover .tp-card-lessons{max-height:500px;}
.tp-card-lessons-inner{padding:0 14px 14px;border-top:1.5px solid #d6e4d6;margin-top:4px;padding-top:10px;}
.tp-card-lessons-inner h4{font-size:.82rem;font-weight:700;margin-bottom:8px;text-align:start;}
.tp-llist{display:flex;flex-wrap:wrap;gap:7px;}
.tp-lbtn{padding:8px 13px;border-radius:10px;background:#f5f8f2;border:1.5px solid #d6e4d6;font-size:.82rem;font-weight:500;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:6px;}
.tp-lbtn:hover{color:#fff;border-color:transparent;}
.tp-lbtn .tp-pc{font-size:.68rem;opacity:.5;white-space:nowrap;}

/* ─── ABOUT-MATH CARDS (now uses tp-card style — direct click, no expand) ─── */
.tp-card-direct{cursor:pointer;}
.tp-card-direct:hover{transform:translateY(-6px);box-shadow:0 12px 36px rgba(0,0,0,.14);}

/* ─── LESSON PAGE ─── */
.lp-wrap{position:relative;flex:1;display:flex;flex-direction:column;min-height:60vh;}
.lp-title{padding:18px 28px;background:var(--bg);border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.lp-title h2{font-size:1.35rem;font-weight:700;}
.pb{padding:4px 12px;background:#e3f2fd;color:var(--g-blue);border-radius:8px;font-size:.82rem;font-weight:600;}
.vf{background:#f5f7fa;border:1px solid var(--bd);border-radius:12px;min-height:320px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;color:var(--tm);font-size:.9rem;margin:20px 28px;position:relative;}.vf .vi{font-size:3rem;opacity:.4;}
.vf-slide{position:absolute;top:12px;inset-inline-start:16px;padding:4px 12px;background:var(--bg);border:1px solid var(--bd);border-radius:7px;font-size:.7rem;font-weight:600;color:var(--ts);}
.vf:fullscreen{margin:0;border-radius:0;min-height:100vh;background:#fff;}
.vf:-webkit-full-screen{margin:0;border-radius:0;min-height:100vh;background:#fff;}
.vc{display:flex;align-items:center;justify-content:space-between;padding:12px 28px;border-top:1px solid var(--bd);background:var(--bg);flex-wrap:wrap;gap:8px;margin-top:auto;}
.pn-row{display:flex;align-items:center;gap:8px;}
.pn-row .nb{padding:5px 12px;font-size:.78rem;border-radius:7px;}
.dn{display:flex;gap:6px;}
.db{width:28px;height:28px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);font-size:.75rem;cursor:pointer;font-weight:600;font-family:inherit;transition:all .2s;}.db.on{background:var(--g-blue);color:#fff;border-color:var(--g-blue);}
.va{display:flex;gap:8px;}
.ab{padding:6px 14px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-size:.8rem;font-family:inherit;transition:all .2s;display:flex;align-items:center;gap:5px;}.ab:hover{background:#eef5ee;}
.ls-btn{padding:6px 14px;border-radius:8px;border:1px solid var(--g-blue);background:#e8f5e9;color:var(--g-blue);font-size:.78rem;cursor:pointer;font-family:inherit;font-weight:600;transition:all .2s;display:flex;align-items:center;gap:6px;}
.ls-btn:hover{background:var(--g-blue);color:#fff;}
.nb{padding:8px 20px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-size:.85rem;font-weight:500;font-family:inherit;transition:all .2s;}.nb:hover:not(:disabled){background:#eef5ee;border-color:var(--g-green);}.nb:disabled{opacity:.35;cursor:not-allowed;}
.nc{font-size:.78rem;color:var(--tm);font-weight:600;}
/* ─── OVERLAY PANEL ─── */
.ov-back{position:absolute;inset:0;background:rgba(15,23,42,.18);backdrop-filter:blur(2px);opacity:0;pointer-events:none;transition:opacity .3s;z-index:40;}
.ov-back.show{opacity:1;pointer-events:auto;}
.ov-panel{position:absolute;top:0;bottom:0;inset-inline-start:0;width:300px;background:var(--bg);border-inline-end:1px solid var(--bd);box-shadow:6px 0 32px rgba(0,0,0,.1);z-index:45;transform:translateX(100%);transition:transform .35s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;}
[dir=ltr] .ov-panel{transform:translateX(-100%);}
.ov-panel.show{transform:translateX(0);}
.ov-hdr{padding:16px 18px;border-bottom:1px solid var(--bd);display:flex;align-items:center;justify-content:space-between;}
.ov-hdr h4{font-size:.9rem;font-weight:700;display:flex;align-items:center;gap:8px;}
.ov-close{width:30px;height:30px;border-radius:8px;border:1px solid var(--bd);background:var(--bg);cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center;font-family:inherit;transition:all .2s;color:var(--ts);}
.ov-close:hover{background:#fee2e2;border-color:#fca5a5;color:#dc2626;}
.ov-srch{padding:10px 14px;}
.ov-srch input{width:100%;padding:8px 14px;border-radius:8px;border:1px solid var(--bd);font-size:.8rem;font-family:inherit;outline:none;transition:border .2s;}
.ov-srch input:focus{border-color:var(--g-blue);}
.ov-list{flex:1;overflow-y:auto;padding:6px 10px;}
.ov-it{padding:12px 14px;border-radius:12px;cursor:pointer;font-size:.82rem;margin-bottom:5px;transition:all .25s;border:1.5px solid transparent;display:flex;align-items:flex-start;gap:12px;}
.ov-it:hover{background:#f2f7ef;border-color:#c8e6c9;}
.ov-it.on{background:linear-gradient(135deg,#e8f5e9,#c8e6c9);border-color:var(--g-green);box-shadow:0 2px 8px rgba(76,175,80,.12);}
.ov-it-num{width:28px;height:28px;border-radius:8px;background:#f1f5ef;display:flex;align-items:center;justify-content:center;font-size:.72rem;font-weight:700;color:var(--ts);flex-shrink:0;}
.ov-it.on .ov-it-num{background:var(--g-blue);color:#fff;}
.ov-it-info{flex:1;min-width:0;}
.ov-it-name{font-weight:600;margin-bottom:2px;overflow:hidden;text-overflow:ellipsis;}
.ov-it.on .ov-it-name{color:var(--g-blue);}
.ov-it-meta{font-size:.72rem;color:var(--tm);display:flex;align-items:center;gap:8px;}
.ov-now{font-size:.6rem;background:var(--g-blue);color:#fff;padding:2px 6px;border-radius:4px;font-weight:600;}

/* ─── BADGE ─── */
.dbg{display:none;}

/* ─── ACCESSIBILITY: Focus Visible ─── */
*:focus-visible{outline:3px solid #4A90D9;outline-offset:2px;border-radius:4px;}
.tp-nav-btn:focus-visible .tp-nav-link{outline:3px solid #fff;outline-offset:-3px;border-radius:0;}
.tp-card:focus-visible{border-color:#4A90D9;box-shadow:0 0 0 3px rgba(74,144,217,.3);}
.tc:focus-visible{border-color:#4A90D9;box-shadow:0 0 0 3px rgba(74,144,217,.3);transform:translateY(-4px);}
.tp-lbtn:focus-visible{outline:3px solid #4A90D9;outline-offset:1px;}
.ov-it:focus-visible{border-color:var(--g-green);background:#eef5ee;}
.skip-link{position:absolute;top:-100px;left:50%;transform:translateX(-50%);background:var(--g-blue);color:#fff;padding:10px 20px;border-radius:0 0 8px 8px;z-index:9999;font-size:.9rem;font-weight:600;transition:top .2s;}
.skip-link:focus{top:0;}

/* ─── BACK NAV ─── */
.tp-back{display:flex;align-items:center;gap:6px;padding:10px 28px 0;font-size:.85rem;color:var(--g-blue);cursor:pointer;font-weight:500;transition:color .2s;width:fit-content;}
.tp-back:hover{color:#1040a0;text-decoration:underline;}
.tp-back svg{width:16px;height:16px;fill:currentColor;}

/* ─── MOBILE TOUCH: Card expansion via tap ─── */
.tp-card.expanded .tp-card-lessons{max-height:500px;}
@media(hover:none){.tp-card:hover .tp-card-lessons{max-height:0;}.tp-card.expanded .tp-card-lessons{max-height:500px;}}

/* ─── TOUCH TARGETS ─── */
.tp-lbtn{min-height:44px;min-width:44px;display:inline-flex;align-items:center;}

/* ─── MICROINTERACTIONS: Active/Press States ─── */
.tc:active,.tp-card:active,.trust-card:active,.tp-lbtn:active,.nb:active,.ab:active,.ls-btn:active,.lb:active,.zb:active{transform:scale(.96) !important;transition:transform .1s;}
.tp-nav-btn:active .tp-nav-link{filter:brightness(.9);}

/* ─── SCROLL-TRIGGERED ENTRANCE ANIMATIONS ─── */
.fade-in{opacity:0;transform:translateY(24px);transition:opacity .5s cubic-bezier(.4,0,.2,1),transform .5s cubic-bezier(.4,0,.2,1);}
.fade-in.visible{opacity:1;transform:translateY(0);}
.fade-in-stagger{transition-delay:calc(var(--si,0) * 80ms);}

/* ─── PREFERS-REDUCED-MOTION ─── */
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:0.01ms !important;animation-iteration-count:1 !important;transition-duration:0.01ms !important;scroll-behavior:auto !important;}
  .fade-in{opacity:1;transform:none;}
  .sym{animation:none;opacity:.08;}
  .page{transition:none;}.page.active{opacity:1;}
}

/* ─── RESPONSIVE ─── */
@media(max-width:900px){.tg{grid-template-columns:repeat(2,1fr);}.tp-grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));}.ov-panel{width:85%;}.vf{margin:14px 16px;min-height:250px;}}
@media(max-width:600px){.hdr{padding:10px 14px;}.lt{display:none;}.hero{flex-direction:column;min-height:auto;}.hero-img{min-height:200px;flex:none;}.hero-img::after{width:100%;height:60px;top:auto;bottom:0;right:0;left:0;background:linear-gradient(to top,#fff 0%,rgba(255,255,255,.85) 25%,rgba(255,255,255,.4) 60%,transparent 100%);}.hero-content{max-width:100%;padding:24px 16px 16px;}.hero-slide{min-height:180px;padding:10px 0;}.hero h1{font-size:1.2rem;}.hero h2.hero-sub{font-size:.95rem;}.hero-links{flex-wrap:wrap;}.hero-link{flex:1 1 45%;font-size:.68rem;}.stb{gap:12px;font-size:.78rem;}.trust{flex-direction:column;align-items:center;margin-top:0;padding:0 14px;}.trust-card{max-width:100%;width:100%;}.tsc{padding:28px 14px;}.tg{grid-template-columns:1fr;}.ftr{padding:8px 12px;justify-content:center;text-align:center;}.bc,.ttabs,.tp-search,.tp-main,.lp-title,.vc{padding-inline:14px;}.vf{margin:10px 14px;}}
</style>
</head>

  <div class="trust">

function rHome(){document.getElementById('tg').innerHTML=D.map((x,j)=>`<div class="tc fade-in fade-in-stagger" style="--cc:${x.c};--si:${j}" onclick="goT(${j})" tabindex="0" role="button" aria-label="${esc(t(x.n))}" onkeydown="if(event.key==='Enter')goT(${j})"><div class="tci" style="background:${x.bg}" aria-hidden="true">${x.icon}</div><div class="tcn"><h3>${t(x.n)}</h3><p>${t(x.ds)}</p></div></div>`).join('');observeFadeIns();}
function show(p){clearInterval(heroTimer);document.querySelectorAll('.page').forEach(x=>{x.classList.remove('active');x.style.opacity='0';});const el=document.getElementById('p-'+p);el.classList.add('active');requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.opacity='1';}));window.scrollTo(0,0);if(p==='home'){heroTimer=setInterval(()=>goHeroSlide((heroIdx+1)%heroTotal),5000);}}
function goHome(){cT=null;show('home');}
function toggleCard(el){el.classList.toggle('expanded');}
function rAboutCards(cards,fl){

        <div class="tp-card-meta"><span class="tp-card-dot" style="background:${sh.dot}"></span>${t(c.d)}</div>
      </div>
    </div>`;
  }).join('');
}
function filterAbout(q){

}

function goT(idx){
  cT=idx;cSi=0;const tp=D[idx],v=i();

  if(tp.isA){

    w.innerHTML=`

// Subtopic visual data — SVGs and gradients per topic color
const subVis=[
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><line x1="14" y1="24" x2="50" y2="24"/><line x1="14" y1="40" x2="50" y2="40"/></svg>',icon:'='},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M10 52 C20 52 24 12 32 12 S44 52 54 52"/></svg>',icon:'f(x)'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="18,16 46,16 28,32 46,48 18,48"/></svg>',icon:'∑'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2"><path d="M20 12c-6 0-8 4-8 10s4 8 4 10-4 4-4 10 2 10 8 10"/><path d="M44 12c6 0 8 4 8 10s-4 8-4 10 4 4 4 10-2 10-8 10"/></svg>',icon:'{}'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="10,36 20,36 28,52 44,12 54,12"/></svg>',icon:'√'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 52 C18 52 22 14 32 14 Q42 14 52 24"/></svg>',icon:'log'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><path d="M10 12 Q32 60 54 12"/><line x1="32" y1="10" x2="32" y2="50" stroke-dasharray="4"/></svg>',icon:'∪'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2"><rect x="14" y="14" width="36" height="36" rx="4"/><line x1="14" y1="32" x2="50" y2="32"/><line x1="32" y1="14" x2="32" y2="50"/></svg>',icon:'[ ]'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><line x1="16" y1="20" x2="48" y2="32"/><line x1="16" y1="44" x2="48" y2="32"/><line x1="16" y1="50" x2="48" y2="50"/></svg>',icon:'≤'},
  {svg:'<svg viewBox="0 0 64 64" fill="none" stroke="#fff" stroke-width="2.5"><polyline points="12,12 32,48 52,12"/></svg>',icon:'|x|'}
];
function subVisFor(si){return subVis[si%subVis.length];}
// Generate shades of the topic color — each subtopic gets a distinct shade
function hsl(hex){const r=parseInt(hex.slice(1,3),16)/255,g=parseInt(hex.slice(3,5),16)/255,b=parseInt(hex.slice(5,7),16)/255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let h=0;if(d){if(mx===r)h=((g-b)/d+6)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;}const l=(mx+mn)/2;const s=d?(d/(1-Math.abs(2*l-1))):0;return [Math.round(h),Math.round(s*100),Math.round(l*100)];}
function shadeGrad(hex,si,total){
  const [h,s]=hsl(hex);
  // Spread lightness from 45% to 75% across subtopics
  const step=total>1?30/(total-1):0;
  const l1=45+si*step;
  const l2=l1+12;
  return {grad:`linear-gradient(135deg,hsl(${h},${Math.min(s+10,100)}%,${l1}%),hsl(${h},${Math.min(s+5,100)}%,${l2}%))`,dot:`hsl(${h},${s}%,${l1}%)`};
}

function rTopic(tp,filter){
  const v=i(),subs=tp.subs||[],fl=(filter||'').toLowerCase();
  const totalLessons=subs.reduce((a,s)=>a+s.ls.length,0);
  const filtered=subs.map((s,si)=>({s,si,match:!fl||t(s.n).toLowerCase().includes(fl)||s.ls.some(l=>t(l).toLowerCase().includes(fl))})).filter(x=>x.match);
  const w=document.getElementById('tp-wrap');
  w.innerHTML=`
    ${topicNav(cT)}
    <a class="tp-back" onclick="goHome()" tabindex="0" role="link" onkeydown="if(event.key==='Enter')goHome()"><svg viewBox="0 0 24 24"><path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z"/></svg><span class="t-back">חזרה לנושאים</span></a>
    <div class="tp-bar">
      <div class="tp-search"><input class="tp-si" id="tp-filter" placeholder="${esc(v.sr)}" value="${esc(filter||'')}" oninput="rTopic(D[cT],this.value)" aria-label="${esc(v.sr)}"></div>
    </div>
    ${filtered.length?`<div class="tp-grid">
      ${filtered.map(({s,si})=>{
        const vis=subVisFor(si);
        const sh=shadeGrad(tp.c,si,subs.length);
        const fLessons=fl?s.ls.filter(l=>t(l).toLowerCase().includes(fl)):s.ls;
        return `<div class="tp-card fade-in fade-in-stagger" style="--si:${si}" tabindex="0" role="button" aria-label="${esc(t(s.n))} — ${s.ls.length} ${esc(v.ls)}" onclick="toggleCard(this)" onkeydown="if(event.key==='Enter')toggleCard(this)">
          <div class="tp-card-img" style="background:${sh.grad}" aria-hidden="true">${vis.svg}<span class="tp-overlay">${vis.icon}</span></div>
          <div class="tp-card-body">
            <div class="tp-card-name">${t(s.n)}</div>
            <div class="tp-card-meta"><span class="tp-card-dot" style="background:${sh.dot}"></span>${s.ls.length} ${v.ls} · ${s.ls.reduce((_,l2,li)=>_+(2+((si*7+li*3)%3)),0)} ${v.pr}</div>
          </div>
          <div class="tp-card-lessons">
            <div class="tp-card-lessons-inner">
              <h4 style="color:${sh.dot}">📋 ${v.ls}</h4>
              <div class="tp-llist">${fLessons.map((l,li)=>{
                const pc=2+((si*7+li*3)%3);
                return `<div class="tp-lbtn" role="button" tabindex="0" onclick="goL(${si},${li})" onkeydown="if(event.key==='Enter')goL(${si},${li})" onmouseover="this.style.background='${sh.dot}'" onmouseout="this.style.background=''" aria-label="${esc(t(l))}">${t(l)}<span class="tp-pc" aria-hidden="true">📄 ${pc}</span></div>`;
              }).join('')}</div>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`:`<div class="tp-empty">🔍 ${v.sr}</div>`}`;
  const inp=document.getElementById('tp-filter');
  if(inp&&fl){inp.focus();inp.setSelectionRange(fl.length,fl.length);}
  if(typeof observeFadeIns==='function') observeFadeIns();
}

// jumpSec no longer needed with card grid

// ─── LESSON (Option B — Floating Overlay) ───
let cPi=0,cLessons=[],cLessonPc=[];
function goL(si,li){
  cSi=si;cLi=li;cPi=0;const tp=D[cT],v=i();
  let lName,subName;
  cLessons=[];cLessonPc=[];
  if(tp.isA){
    cLessons=tp.cards.map(x=>t(x.n));
    lName=cLessons[li];subName=t(tp.n);
  } else {
    const sub=tp.subs[si];subName=t(sub.n);
    cLessons=sub.ls.map(x=>t(x));lName=cLessons[li];
  }
  // Generate stable pres counts per lesson
  cLessonPc=cLessons.map((_,j)=>2+((cT*7+si*3+j*5)%3));
  const pc=cLessonPc[li];
  // Breadcrumbs
  const a=document.getElementById('bclt');a.textContent=t(tp.n);a.onclick=()=>goT(cT);
  const b=document.getElementById('bcls');b.textContent=subName;b.onclick=()=>goT(cT);
  document.getElementById('bcln').textContent=lName;
  // Title
  document.getElementById('l-title').textContent=lName;
  document.getElementById('l-badge').textContent=pc+' '+v.pr;
  // Viewer
  document.getElementById('l-slide').textContent=v.pr+' 1 / '+pc;
  document.getElementById('l-vw').textContent=v.vw;
  // Controls
  document.getElementById('l-ctrl').innerHTML=`
    <div class="pn-row">
      <button class="nb" id="pp" onclick="chP(-1)" disabled>${v.pv}</button>
      <div class="dn" id="pdots">${Array.from({length:pc},(_,j)=>`<button class="db${j===0?' on':''}" onclick="goP(${j})">${j+1}</button>`).join('')}</div>
      <button class="nb" id="pn" onclick="chP(1)" ${pc<=1?'disabled':''}>${v.nx}</button>
      <span class="nc" id="pcount">1 / ${pc}</span>
    </div>
    <div class="va">
      <button class="ls-btn" onclick="openOv()">📋 ${v.ls} <span style="font-size:.68rem">(${cLessons.length})</span></button>
      <button class="ab" onclick="togFS()">${v.fs}</button>
      <button class="ab">${v.ws}</button>
    </div>`;
  // Overlay search placeholder
  document.getElementById('ov-filter').placeholder=v.sr;
  document.getElementById('ov-filter').value='';
  // Render overlay list
  renderOv();
  // Close overlay if open
  closeOv();
  show('lesson');
}
function renderOv(filter){
  const v=i(),f=(filter||'').trim().toLowerCase();
  document.getElementById('ov-list').innerHTML=cLessons.map((l,j)=>{
    if(f && !l.toLowerCase().includes(f)) return '';
    const pc=cLessonPc[j];
    return `<div class="ov-it${j===cLi?' on':''}" onclick="goL(cSi,${j})">
      <div class="ov-it-num">${j+1}</div>
      <div class="ov-it-info">
        <div class="ov-it-name">${l}</div>
        <div class="ov-it-meta"><span>📄 ${pc} ${v.pr}</span>${j===cLi?'<span class="ov-now">⬤</span>':''}</div>
      </div></div>`;
  }).join('');
}
function filterOv(v){renderOv(v);}
function openOv(){
  document.getElementById('ov-back').classList.add('show');
  document.getElementById('ov-panel').classList.add('show');
  renderOv();
}
function closeOv(){
  document.getElementById('ov-back').classList.remove('show');
  document.getElementById('ov-panel').classList.remove('show');
}
function goP(pi){
  const pc=cLessonPc[cLi];
  cPi=Math.max(0,Math.min(pc-1,pi));
  document.querySelectorAll('#pdots .db').forEach((b,j)=>{b.classList.toggle('on',j===cPi);});
  document.getElementById('pp').disabled=cPi===0;
  document.getElementById('pn').disabled=cPi>=pc-1;
  document.getElementById('pcount').textContent=(cPi+1)+' / '+pc;
  const v=i();
  document.getElementById('l-slide').textContent=v.pr+' '+(cPi+1)+' / '+pc;
}
function chP(d){goP(cPi+d);}
function togFS(){
  const el=document.getElementById('l-viewer');
  if(!document.fullscreenElement&&!document.webkitFullscreenElement){
    if(el.requestFullscreen) el.requestFullscreen();
    else if(el.webkitRequestFullscreen) el.webkitRequestFullscreen();
  } else {
    if(document.exitFullscreen) document.exitFullscreen();
    else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
  }
}

// ─── ZOOM ───
let zm=1;
function chZ(d){zm=Math.round((zm+d)*10)/10;zm=Math.max(.7,Math.min(1.5,zm));document.documentElement.style.setProperty('--zoom',zm);document.getElementById('zp').textContent=Math.round(zm*100)+'%';document.getElementById('zo').disabled=zm<=.7;document.getElementById('zi').disabled=zm>=1.5;}

// Scroll-triggered entrance animations via IntersectionObserver
const fadeObs=new IntersectionObserver((entries)=>{
  entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');fadeObs.unobserve(e.target);}});
},{threshold:.12});
function observeFadeIns(){document.querySelectorAll('.fade-in:not(.visible)').forEach(el=>fadeObs.observe(el));}

// INIT
rLB();rHome();
document.getElementById('yr').textContent=new Date().getFullYear();
observeFadeIns();
// Re-observe after page transitions
const origShow=show;
show=function(p){origShow(p);requestAnimationFrame(()=>setTimeout(observeFadeIns,60));};

// Hero horizontal carousel (slide R→L)
let heroIdx=0;
const heroTotal=heroSlides.length;
renderHeroSlides();
const heroTrack=document.getElementById('hero-track');
function goHeroSlide(idx){
  heroIdx=idx;
  // RTL: positive translateX moves right, so we slide the opposite direction
  heroTrack.style.transform='translateX('+heroIdx*100+'%)';
  document.querySelectorAll('.hero-dot').forEach((d,i)=>d.classList.toggle('active',i===heroIdx));
}
function initHeroDotKeyboard(){
  document.querySelectorAll('.hero-dot').forEach((dot,idx)=>{dot.addEventListener('keydown',(e)=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();const dots=document.querySelectorAll('.hero-dot');const newIdx=e.key==='ArrowRight'?(idx+1)%heroTotal:(idx-1+heroTotal)%heroTotal;dots[newIdx].focus();goHeroSlide(newIdx);}else if(e.key==='Enter'||e.key===' '){e.preventDefault();goHeroSlide(idx);}});});
}
initHeroDotKeyboard();
let heroTimer=setInterval(()=>goHeroSlide((heroIdx+1)%heroTotal),5000);
// Pause auto-slide on hover
document.querySelector('.hero-carousel').addEventListener('mouseenter',()=>clearInterval(heroTimer));
document.querySelector('.hero-carousel').addEventListener('mouseleave',()=>{clearInterval(heroTimer);heroTimer=setInterval(()=>goHeroSlide((heroIdx+1)%heroTotal),5000);});

</script>
